[project]
name = "mc-backup-r2"
version = "0.1.0"
description = "MC world backup via SFTP to Cloudflare R2"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0",
    "boto3>=1.28",
    'tomli>=2.0; python_version < "3.11"',
]

[project.scripts]
mc-backup = "mc_backup.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
